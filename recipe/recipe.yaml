schema_version: 1

context:
  python_min: "3.12"
  version: "0.6.1"

recipe:
  name: openff-nagl-split
  version: ${{ version }}

source:
  url: https://github.com/openforcefield/openff-nagl/archive/v${{ version }}.tar.gz
  sha256: 423aba5bf57db461d8021cdf9e0dc69f9b289d2cd27b6d2735ac9e62dddacd94

build:
  number: 0

outputs:
  - package:
      name: openff-nagl-base
    build:
      noarch: python
      script:
        file: build_base.sh
    requirements:
      host:
        - python ${{ python_min }}.*
        - pip
        - setuptools
        - setuptools-scm
      run:
        - python >=${{ python_min }}
        - click
        - click-option-group
        - tqdm
        - openff-toolkit-base >=0.11.0
        - openff-units
        - pyyaml
        - pydantic =2
        - pytorch >=2.6
        - pytorch-lightning
        - rdkit
        - rich
      run_constraints:
        - dgl >=1.0,<=3
        - openeye-toolkits
    tests:
      - python:
          imports:
            - openff.nagl
          pip_check: false
          python_version:
            - ${{ python_min }}.*
            - "*"
  - package:
      name: openff-nagl
    build:
      noarch: python
    requirements:
      host:
        - python ${{ python_min }}.*
      run:
        - python >=${{ python_min }}
        - openff-nagl-models >=0.1.0
        - ${{ pin_subpackage('openff-nagl-base', exact=True) }}
    tests:
      - python:
          imports:
            - openff.nagl
          pip_check: false
          python_version:
            - ${{ python_min }}.*
            - "*"
        files:
          recipe:
            - test_nagl.py
        script:
          - python test_nagl.py

about:
  license: MIT
  license_file: LICENSE
  summary: A library for applying graph convolutional neural networks to molecules
  homepage: https://openforcefield.org/
  repository: https://github.com/openforcefield/openff-nagl

extra:
  feedstock-name: openff-nagl
  recipe-maintainers:
    - mattwthompson
    - j-wags
    - lilyminium
